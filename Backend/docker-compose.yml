services:
  web:
    image: python-fastapi:1.0
    build: .
    container_name: plants-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      - db

  db:
    image: postgres:15.0-alpine
    container_name: plants-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
          - .env
    ports:
      - "5432:5432"

volumes:
  postgres_data: