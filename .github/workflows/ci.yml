name: CI Frontend

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: src

      - name: Analyze
        run: flutter analyze --fatal-infos
        working-directory: src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: src

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded
        working-directory: src

      - name: Install lcov
        if: always()
        run: sudo apt-get install -y lcov

      - name: Generate HTML coverage report
        if: always()
        run: genhtml src/coverage/lcov.info -o coverage_report --no-function-coverage
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_report/

      - name: Check coverage threshold (40%)
        run: |
          COVERAGE=$(lcov --summary src/coverage/lcov.info 2>&1 | grep "lines" | grep -oP '[\d.]+(?=%)' | head -1)
          echo "Coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "::warning::No se pudo calcular la cobertura"
            exit 0
          fi
          if (( $(echo "$COVERAGE < 40" | bc -l) )); then
            echo "::error::Cobertura ${COVERAGE}% por debajo del umbral mínimo de 40%"
            exit 1
          fi
          echo "Cobertura ${COVERAGE}% supera el umbral de 40%"
